basePath: /
consumes:
- application/json
definitions:
  requests.CreateWorkout:
    type: object
  requests.DevLogin:
    properties:
      user_id:
        example: 00000000-0000-0000-0000-000000000001
        type: string
    type: object
  requests.UpdateWorkout:
    properties:
      status:
        description: 当前仅支持更新为已完成。
        enum:
        - 2
        type: integer
    required:
    - status
    type: object
  responses.Health:
    properties:
      code:
        example: database_unavailable
        type: string
      database:
        example: ok
        type: string
      status:
        example: ok
        type: string
    type: object
  responses.Identity:
    properties:
      user_id:
        type: string
    type: object
  responses.Login:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
    type: object
  responses.WorkoutRecord:
    properties:
      completed_at:
        type: string
      id:
        type: string
      started_at:
        type: string
      status:
        type: integer
    type: object
  responses.WorkoutStat:
    properties:
      completed_at:
        type: string
      completed_exercise_count:
        type: integer
      completed_set_count:
        type: integer
      duration_seconds:
        type: integer
      id:
        type: string
      started_at:
        type: string
      status:
        type: integer
      total_reps:
        type: integer
      total_volume_kg:
        type: string
    type: object
info:
  contact: {}
  description: 居家力量训练记录 API。
  title: Stronger API
  version: "1.0"
paths:
  /api/v1/auth/dev/login:
    post:
      parameters:
      - description: 开发登录请求
        in: body
        name: body
        schema:
          $ref: '#/definitions/requests.DevLogin'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Login'
      summary: 开发测试登录（仅 DEBUG=true）
      tags:
      - auth
  /api/v1/me:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Identity'
      security:
      - BearerAuth: []
      summary: 获取当前用户身份
      tags:
      - auth
  /api/v1/workouts:
    post:
      parameters:
      - description: 创建请求
        in: body
        name: body
        schema:
          $ref: '#/definitions/requests.CreateWorkout'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.WorkoutRecord'
      security:
      - BearerAuth: []
      summary: 创建空训练
      tags:
      - workouts
  /api/v1/workouts/{id}:
    put:
      parameters:
      - description: 训练 UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: 更新请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.UpdateWorkout'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.WorkoutRecord'
      security:
      - BearerAuth: []
      summary: 更新训练状态
      tags:
      - workouts
  /api/v1/workouts/{id}/stat:
    get:
      parameters:
      - description: 训练 UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.WorkoutStat'
      security:
      - BearerAuth: []
      summary: 查询已完成训练统计
      tags:
      - workouts
  /health:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Health'
      summary: 健康检查
      tags:
      - health
produces:
- application/json
securityDefinitions:
  BearerAuth:
    description: 填写 Bearer <access_token>。
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
