name: stronger

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stronger
      POSTGRES_PASSWORD: stronger
      POSTGRES_DB: stronger
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/000001_phase1_init.up.sql:/docker-entrypoint-initdb.d/001_phase1_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stronger -d stronger"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
    environment:
      DEBUG: ${DEBUG:-false}
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://stronger:stronger@db:5432/stronger?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
